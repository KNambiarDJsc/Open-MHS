<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" role="img" aria-labelledby="t d">
  <title id="t">Command lifecycle</title>
  <desc id="d">A command moves from CREATED through VALIDATING, APPROVED, DISPATCHED, ACCEPTED and APPLIED to VERIFIED. Validation can end in DENIED or wait in AWAITING_APPROVAL. A dispatched command that times out becomes UNKNOWN_OUTCOME and is resolved by readback to RECONCILED_APPLIED or RECONCILED_NOT_APPLIED. An applied command whose readback disagrees becomes VERIFICATION_FAILED.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c5c5c"/>
    </marker>
  </defs>
  <style>
    text { font-family: Consolas, "DejaVu Sans Mono", monospace; font-size: 10.5px; fill: #1c1c1c; }
    .n { fill: #ffffff; stroke: #2b2b2b; stroke-width: 1.3; }
    .ok { fill: #eaf4ea; stroke: #2e7d32; stroke-width: 1.3; }
    .bad { fill: #fbeceb; stroke: #b3261e; stroke-width: 1.3; }
    .warn { fill: #fbf3e2; stroke: #9a6200; stroke-width: 1.3; }
    .l { stroke: #5c5c5c; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    .legend { font-family: Consolas, "DejaVu Sans Mono", monospace; font-size: 11px; fill: #5c5c5c; }
  </style>

  <!-- waiting for a person -->
  <rect x="180" y="6" width="150" height="30" rx="3" class="warn"/>
  <text x="255" y="25" text-anchor="middle">AWAITING_APPROVAL</text>
  <path class="l" d="M192 60 L206 38"/>
  <path class="l" d="M310 37 L290 58"/>

  <!-- the main path -->
  <rect x="16" y="60" width="92" height="34" rx="3" class="n"/>
  <text x="62" y="81" text-anchor="middle">CREATED</text>
  <rect x="122" y="60" width="92" height="34" rx="3" class="n"/>
  <text x="168" y="81" text-anchor="middle">VALIDATING</text>
  <rect x="228" y="60" width="92" height="34" rx="3" class="n"/>
  <text x="274" y="81" text-anchor="middle">APPROVED</text>
  <rect x="334" y="60" width="92" height="34" rx="3" class="n"/>
  <text x="380" y="81" text-anchor="middle">DISPATCHED</text>
  <rect x="440" y="60" width="92" height="34" rx="3" class="n"/>
  <text x="486" y="81" text-anchor="middle">ACCEPTED</text>
  <rect x="546" y="60" width="92" height="34" rx="3" class="n"/>
  <text x="592" y="81" text-anchor="middle">APPLIED</text>
  <rect x="652" y="60" width="92" height="34" rx="3" class="ok"/>
  <text x="698" y="81" text-anchor="middle">VERIFIED</text>
  <path class="l" d="M108 77 L120 77"/>
  <path class="l" d="M214 77 L226 77"/>
  <path class="l" d="M320 77 L332 77"/>
  <path class="l" d="M426 77 L438 77"/>
  <path class="l" d="M532 77 L544 77"/>
  <path class="l" d="M638 77 L650 77"/>

  <!-- refused before anything is sent -->
  <path class="l" d="M168 94 L168 138"/>
  <rect x="122" y="140" width="92" height="34" rx="3" class="bad"/>
  <text x="168" y="161" text-anchor="middle">DENIED</text>
  <text x="168" y="190" text-anchor="middle" class="legend">never sent to the device</text>

  <!-- uncertain, then settled by reading the device -->
  <path class="l" d="M380 94 L380 138"/>
  <rect x="334" y="140" width="92" height="34" rx="3" class="warn"/>
  <text x="380" y="161" text-anchor="middle">TIMED_OUT</text>
  <path class="l" d="M380 174 L380 208"/>
  <rect x="316" y="210" width="128" height="34" rx="3" class="warn"/>
  <text x="380" y="231" text-anchor="middle">UNKNOWN_OUTCOME</text>
  <path class="l" d="M444 220 L470 208"/>
  <path class="l" d="M444 234 L470 248"/>
  <rect x="472" y="192" width="160" height="30" rx="3" class="ok"/>
  <text x="552" y="211" text-anchor="middle">RECONCILED_APPLIED</text>
  <rect x="472" y="234" width="176" height="30" rx="3" class="bad"/>
  <text x="560" y="253" text-anchor="middle">RECONCILED_NOT_APPLIED</text>
  <text x="380" y="282" text-anchor="middle" class="legend">resolved by readback, never retried blindly</text>

  <!-- applied, but the readback disagrees -->
  <path class="l" d="M610 94 L610 138"/>
  <rect x="546" y="140" width="136" height="34" rx="3" class="bad"/>
  <text x="614" y="161" text-anchor="middle">VERIFICATION_FAILED</text>

  <rect x="16" y="300" width="10" height="10" class="ok"/><text x="32" y="309" class="legend">confirmed by readback</text>
  <rect x="262" y="300" width="10" height="10" class="bad"/><text x="278" y="309" class="legend">refused or not as asked</text>
  <rect x="462" y="300" width="10" height="10" class="warn"/><text x="478" y="309" class="legend">waiting or uncertain</text>
</svg>
