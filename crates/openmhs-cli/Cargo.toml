[package]
name = "openmhs-cli"
description = "The openmhs command-line tool and openmhsd gateway binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "openmhs"
path = "src/main.rs"

[[bin]]
name = "openmhsd"
path = "src/bin/openmhsd.rs"

[dependencies]
clap.workspace = true
openmhs-adapter.workspace = true
openmhs-api.workspace = true
openmhs-conformance.workspace = true
openmhs-gateway.workspace = true
openmhs-host.workspace = true
openmhs-http.workspace = true
openmhs-mcp.workspace = true
openmhs-modbus.workspace = true
openmhs-mqtt.workspace = true
openmhs-policy.workspace = true
openmhs-profile.workspace = true
openmhs-scpi.workspace = true
openmhs-sim.workspace = true
openmhs-types.workspace = true
reqwest.workspace = true
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "net"] }
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# The only crate whose binaries are released (openmhs and openmhsd). Every crate here is
# `publish = false`, so `dist` must be told to release it. See dist-workspace.toml.
[package.metadata.dist]
dist = true
