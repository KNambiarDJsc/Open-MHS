# cargo-deny: what third-party code OpenMHS may depend on (docs/adr/0014-protocol-adapters.md).
# Run `cargo deny check` before adding a dependency; CI runs it on every change.

[graph]
all-features = false

[advisories]
# Known vulnerabilities and unmaintained crates (RustSec) fail the check.
yanked = "deny"
# rumqttc 0.25.1 (the newest release) links rustls-webpki 0.102 and rustls-pemfile when
# its rustls feature is on, but OpenMHS always passes its own rustls ClientConfig
# (TlsConfiguration::Rustls): certificates are then verified by rustls 0.23 with
# rustls-webpki 0.103, and rumqttc uses webpki 0.102 only for an error type and
# rustls-pemfile only for TlsConfiguration::Simple, which OpenMHS never builds
# (docs/security/transport-security.md, ADR-0016). Remove these when rumqttc moves on.
ignore = [
    { id = "RUSTSEC-2026-0049", reason = "rustls-webpki 0.102 via rumqttc; not used for verification" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.102 via rumqttc; not used for verification" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.102 via rumqttc; not used for verification" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.102 via rumqttc; not used for verification" },
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.102 via rumqttc; 0.103.16, which verifies, is fixed" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile via rumqttc, only for TlsConfiguration::Simple" },
]

[licenses]
confidence-threshold = 0.9
# Permissive licences only, compatible with the project's Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    # ring, rustls-webpki, untrusted (TLS, ADR-0016).
    "ISC",
    "Unicode-3.0",
]

# serialport (via tokio-serial, for SCPI over serial lines) is MPL-2.0: file-level copyleft
# that covers changes to its own files only, which OpenMHS does not modify (ADR-0014).
[[licenses.exceptions]]
crate = "serialport"
allow = ["MPL-2.0"]

# The same for option-ext (via dirs, which finds the per-user data directory).
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

# Mozilla's root certificates as data (via reqwest's rustls-platform-verifier). OpenMHS
# trusts the system store or a CA file instead (docs/security/transport-security.md).
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal crates (`publish = false`) may use bare path dependencies; publishable ones
# get versions from the workspace (Cargo.toml).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
