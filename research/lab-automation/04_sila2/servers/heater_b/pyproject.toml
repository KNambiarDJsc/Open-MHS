[project]
name = "heater_b"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "sila2",
    "typer",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["heater_b*"]

[tool.setuptools.package-data]
"heater_b.generated" = [
    "*/*.sila.xml",
    "*/*.proto",
]
