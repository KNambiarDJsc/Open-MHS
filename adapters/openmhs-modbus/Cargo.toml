[package]
name = "openmhs-modbus"
description = "OpenMHS adapter for Modbus TCP devices, driven by a register-map profile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
openmhs-adapter.workspace = true
openmhs-conformance.workspace = true
openmhs-profile.workspace = true
openmhs-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
# Modbus TCP client (MIT OR Apache-2.0); the simulator is hand-written so it can misbehave.
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
