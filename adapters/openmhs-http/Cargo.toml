[package]
name = "openmhs-http"
description = "OpenMHS adapter for simple networked devices with an HTTP/JSON API, driven by a declarative mapping"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
openmhs-adapter.workspace = true
openmhs-conformance.workspace = true
openmhs-profile.workspace = true
openmhs-types.workspace = true
rustls.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
# The simulator can serve TLS, for the TLS tests.
tokio-rustls.workspace = true

[dev-dependencies]
openmhs-profile = { workspace = true, features = ["test-pki"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
