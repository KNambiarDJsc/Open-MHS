[package]
name = "openmhs-scpi"
description = "OpenMHS adapter for SCPI instruments over TCP or serial, driven by a command-set profile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
openmhs-adapter.workspace = true
openmhs-conformance.workspace = true
openmhs-profile.workspace = true
openmhs-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
# Serial ports (MPL-2.0 via serialport); no libudev, so no system libraries on Linux.
tokio-serial = { version = "5.5", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
