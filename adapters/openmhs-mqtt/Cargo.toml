[package]
name = "openmhs-mqtt"
description = "OpenMHS adapter for devices that publish state and take commands over MQTT"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
# Already a dependency of rumqttc; the simulated broker uses it with rumqttc's packet codec.
bytes = "1"
openmhs-adapter.workspace = true
openmhs-conformance.workspace = true
openmhs-profile.workspace = true
openmhs-types.workspace = true
rustls.workspace = true
# rustls without a crypto provider: OpenMHS passes its own ClientConfig (ring).
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
# The simulator can serve TLS, for the TLS tests.
tokio-rustls.workspace = true

[dev-dependencies]
openmhs-profile = { workspace = true, features = ["test-pki"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
