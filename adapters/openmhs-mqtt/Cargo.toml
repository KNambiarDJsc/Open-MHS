[package]
name = "openmhs-mqtt"
description = "OpenMHS adapter for devices that publish state and take commands over MQTT"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
# Already a dependency of rumqttc; the simulated broker uses it with rumqttc's packet codec.
bytes = "1"
openmhs-adapter.workspace = true
openmhs-conformance.workspace = true
openmhs-profile.workspace = true
openmhs-types.workspace = true
# No TLS or websocket features: plain TCP to a broker on the lab network.
rumqttc = { version = "0.25", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
