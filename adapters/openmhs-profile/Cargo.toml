[package]
name = "openmhs-profile"
description = "Device profiles for OpenMHS protocol adapters: a descriptor, a protocol mapping and a connection in one file, plus the virtual device the protocol simulators share"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
openmhs-conformance.workspace = true
openmhs-types.workspace = true
rcgen = { workspace = true, optional = true }
rustls.workspace = true
rustls-native-certs.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# Certificates made on the fly, for the adapters' TLS tests (tls::test_pki). Never for
# real deployments.
test-pki = ["dep:rcgen"]

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
