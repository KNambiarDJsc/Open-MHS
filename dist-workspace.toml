[workspace]
members = ["cargo:."]

# Release binaries with cargo-dist (https://opensource.axo.dev/cargo-dist/).
# This builds archives and checksums for `openmhs` and `openmhsd`; it does not publish to
# crates.io or PyPI. The release workflow (.github/workflows/release.yml) runs only when a
# maintainer pushes a version tag. See docs/release/RELEASING.md.
[dist]
# The dist version used in CI (pinned exactly).
cargo-dist-version = "0.32.0"
# CI backend.
ci = "github"
# Archives and checksums only: no shell or PowerShell installer scripts to audit.
installers = []
# Windows x86_64, Linux x86_64, macOS arm64, macOS x86_64.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# A SHA-256 file next to every archive, and one for the whole release.
checksum = "sha256"
unix-archive = ".tar.gz"
windows-archive = ".zip"
# Signed build provenance through GitHub artifact attestations.
github-attestations = true
# Pull requests only run `dist plan`; they never build or upload release artifacts.
pr-run-mode = "plan"
# Hosting for the release artifacts.
hosting = "github"
# release.yml is edited by hand (pinned SHAs, least-privilege permissions, draft releases).
# After upgrading dist, regenerate it and re-apply the changes listed at its top.
allow-dirty = ["ci"]
