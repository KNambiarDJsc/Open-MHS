name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A full run takes well under half an hour; a hang should fail, not wait out GitHub's
    # six-hour limit with no output.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The oldest Python the SDKs support. Before `cargo test`: the adapter-host tests run
      # Python adapters as child processes (docs/architecture/adapter-host.md).
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: End-to-end demo (real gateway, real API, simulated devices)
        run: cargo run -p openmhs-cli --bin openmhs -- demo
      - name: Simulators reach their declared conformance levels
        run: cargo run -p openmhs-cli --bin openmhs -- conformance
      - name: Protocol profiles reach their declared levels against their simulators
        run: >
          cargo run -p openmhs-cli --bin openmhs -- conformance
          --profile adapters/openmhs-modbus/profiles/climate-chamber.json
          --profile adapters/openmhs-mqtt/profiles/greenhouse-node.json
          --profile adapters/openmhs-scpi/profiles/bench-psu.json
          --profile adapters/openmhs-http/profiles/led-controller.json
      - name: A Python adapter reaches its declared level through the adapter host
        run: >
          cargo run -p openmhs-cli --bin openmhs -- conformance
          --adapter-manifest adapters/python/psu-sim/manifest.json
      - name: A scaffolded adapter builds and passes conformance (docs/adapters)
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo run -p openmhs-cli --bin openmhs -- adapter new ci-lamp --path "$RUNNER_TEMP/ci-lamp" --openmhs-path "$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP/ci-lamp" && cargo test
      # numpy for the regression test of importing a native extension after the SDK starts.
      - run: pip install "jsonschema>=4.18" numpy
      - name: Python SDK, agent-loop examples, and CLI/MCP/SDK parity (invariant 10)
        run: python -m unittest discover -s python/tests -v
      - name: Read-only robot example, the parts that need no ROS 2 (the ROS 2 group skips, with a reason)
        run: python -m unittest discover -s examples/ros2-readonly-robot -p "test_*.py" -v
      - name: What a governed MADSci step reports, and the rules for keeping evidence
        run: |
          python -m unittest discover -s research/lab-automation/05_madsci/tests -v
          python -m unittest discover -s research/lab-automation/shared -p "test_*.py" -v

  lab-automation:
    # Simulated only. These runs are what backs any statement that the experiments reproduce
    # on Linux; research/lab-automation/README.md records which of them have been seen to pass.
    name: Lab automation (${{ matrix.ecosystem }}, simulated)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ecosystem: pylabrobot, experiment: 01_pylabrobot, variable: LAB_PY_PYLABROBOT }
          - { ecosystem: opentrons, experiment: 02_opentrons, variable: LAB_PY_OPENTRONS }
          - { ecosystem: sila2, experiment: 04_sila2, variable: LAB_PY_SILA2 }
          - { ecosystem: madsci, experiment: 05_madsci, variable: LAB_PY_MADSCI }
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: cargo build -p openmhs-cli --bin openmhs
      - name: The experiment's locked environment
        run: |
          python -m venv "$RUNNER_TEMP/lab"
          "$RUNNER_TEMP/lab/bin/pip" install -r research/lab-automation/${{ matrix.experiment }}/requirements.lock.txt
          echo "${{ matrix.variable }}=$RUNNER_TEMP/lab/bin/python" >> "$GITHUB_ENV"
      - name: Conformance, contract gaps and scenarios
        env:
          OPENMHS_BIN: ${{ github.workspace }}/target/debug/openmhs
        run: >
          python research/lab-automation/reproduce.py --label ci
          --stages conformance,gaps,scenarios --ecosystems ${{ matrix.ecosystem }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lab-${{ matrix.ecosystem }}
          path: research/lab-automation/results/ci/

  lab-automation-micromanager:
    # Micro-Manager's demo adapters have to be fetched, and whether that works on these runners
    # has not been established. So this one may fail without failing the build, until it has.
    name: Lab automation (micromanager, simulated, experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: cargo build -p openmhs-cli --bin openmhs
      - name: The experiment's locked environment, and Micro-Manager's demo adapters
        run: |
          python -m venv "$RUNNER_TEMP/lab"
          "$RUNNER_TEMP/lab/bin/pip" install -r research/lab-automation/03_micromanager/requirements.lock.txt
          "$RUNNER_TEMP/lab/bin/mmcore" install --test-adapters --dest "$RUNNER_TEMP/mm"
          echo "MM_DIR=$(ls -d "$RUNNER_TEMP"/mm/*/ | head -1)" >> "$GITHUB_ENV"
      - name: Conformance, contract gaps and scenarios
        env:
          OPENMHS_BIN: ${{ github.workspace }}/target/debug/openmhs
          LAB_PY_MICROMANAGER: ${{ runner.temp }}/lab/bin/python
        run: >
          python research/lab-automation/reproduce.py --label ci
          --stages conformance,gaps,scenarios --ecosystems micromanager
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lab-micromanager
          path: research/lab-automation/results/ci/

  opcua:
    name: OPC UA adapter (Python, simulated server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"
      # Pinned; every release at least two weeks old (adapters/python/opcua/requirements.txt).
      - run: pip install -r adapters/python/opcua/requirements.txt
      - name: Certificate checks, refusals and readings against simulated servers
        run: python -m unittest discover -s adapters/python/opcua -v
      - name: Reaches its declared level through the adapter host
        run: >
          cargo run -p openmhs-cli --bin openmhs -- conformance
          --adapter-manifest adapters/python/opcua/manifest.sim.json

  octoprint:
    name: OctoPrint adapter (Python, OctoPrint Virtual Printer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      # Pinned; every release at least two weeks old (adapters/python/octoprint/requirements.txt).
      - run: python -m venv "$RUNNER_TEMP/octo" && "$RUNNER_TEMP/octo/bin/pip" install -r adapters/python/octoprint/requirements.txt
      - run: cargo build -p openmhs-cli --bin openmhs
      - name: Adapter tests against replayed answers, then against a real OctoPrint and through a gateway
        env:
          OPENMHS_OCTOPRINT: ${{ runner.temp }}/octo/bin/octoprint
          OPENMHS_BIN: ${{ github.workspace }}/target/debug/openmhs
        run: python -m unittest discover -s adapters/python/octoprint -v
      - name: The end-to-end demo
        run: >
          python adapters/python/octoprint/demo.py
          --octoprint "$RUNNER_TEMP/octo/bin/octoprint" --bin "$GITHUB_WORKSPACE/target/debug/openmhs"

  ros2:
    name: ROS 2 adapter (Jazzy container, simulated publisher)
    runs-on: ubuntu-latest
    env:
      # ros:jazzy-ros-base as built on 2026-10-02 (docs/adapters/ros2.md).
      ROS_IMAGE: ros@sha256:066420e07f60aa18262f2479981def87ebcfcec42eefb0c0c57c4a46098348ca
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: docker pull "$ROS_IMAGE"
      - name: Refusals and conversions (in the image)
        run: >
          docker run --rm --network none
          -v "$PWD/adapters/python/ros2:/openmhs/adapters/python/ros2:ro"
          -v "$PWD/python:/openmhs/python:ro"
          "$ROS_IMAGE" python3 -m unittest discover -s /openmhs/adapters/python/ros2 -v
      - name: Reaches its declared level through the adapter host
        run: >
          cargo run -p openmhs-cli --bin openmhs -- conformance
          --adapter-manifest adapters/python/ros2/manifest.sim.json

  deny:
    name: Dependencies (licences, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Bundles cargo-deny 0.20.2; the policy is deny.toml (ADR-0014).
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1

  spec:
    name: Spec fixtures and schema portability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python -I tools/gen_invalid_fixtures.py spec/examples/invalid
      - name: Generated fixtures are committed
        run: git diff --exit-code -- spec/examples
      - run: pip install "jsonschema>=4.18"
      - name: Schemas behave the same in an independent implementation
        run: python tools/check_schemas.py

  release-tooling:
    name: Registry, compatibility matrix and release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.18"
      - name: Registry entries and conformance reports are valid
        run: python tools/check_registry.py
      - name: The compatibility matrix is current
        run: python tools/gen_matrix.py --check
      - name: Versions agree across the Rust workspace and the Python package
        run: python tools/check_release_versions.py
      - name: Tests for the registry and matrix tooling
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: The release plan is valid (cargo-dist 0.32.0; builds nothing)
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
          dist plan
