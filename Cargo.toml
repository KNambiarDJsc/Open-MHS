[workspace]
resolver = "3"
members = [
    "crates/openmhs-types",
    "crates/openmhs-adapter",
    "crates/openmhs-policy",
    "crates/openmhs-engine",
    "crates/openmhs-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["OpenMHS contributors"]

[workspace.dependencies]
openmhs-adapter = { path = "crates/openmhs-adapter" }
openmhs-engine = { path = "crates/openmhs-engine" }
openmhs-policy = { path = "crates/openmhs-policy" }
openmhs-sim = { path = "crates/openmhs-sim" }
openmhs-types = { path = "crates/openmhs-types" }

async-trait = "0.1"
jsonschema = { version = "0.60", default-features = false }
proptest = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
