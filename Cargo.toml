[workspace]
resolver = "3"
members = ["crates/openmhs-types"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["OpenMHS contributors"]

[workspace.dependencies]
jsonschema = { version = "0.60", default-features = false }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
