[workspace]
resolver = "3"
members = [
    "crates/openmhs-types",
    "crates/openmhs-adapter",
    "crates/openmhs-policy",
    "crates/openmhs-engine",
    "crates/openmhs-sim",
    "crates/openmhs-api",
    "crates/openmhs-gateway",
    "crates/openmhs-cli",
    "crates/openmhs-mcp",
    "crates/openmhs-conformance",
    "templates/adapter",
    "adapters/openmhs-profile",
    "adapters/openmhs-scpi",
    "adapters/openmhs-modbus",
    "adapters/openmhs-http",
    "adapters/openmhs-mqtt",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["OpenMHS contributors"]

[workspace.dependencies]
openmhs-adapter = { path = "crates/openmhs-adapter" }
openmhs-api = { path = "crates/openmhs-api" }
openmhs-conformance = { path = "crates/openmhs-conformance" }
openmhs-gateway = { path = "crates/openmhs-gateway" }
openmhs-mcp = { path = "crates/openmhs-mcp" }
openmhs-engine = { path = "crates/openmhs-engine" }
openmhs-policy = { path = "crates/openmhs-policy" }
openmhs-profile = { path = "adapters/openmhs-profile" }
openmhs-scpi = { path = "adapters/openmhs-scpi" }
openmhs-modbus = { path = "adapters/openmhs-modbus" }
openmhs-http = { path = "adapters/openmhs-http" }
openmhs-mqtt = { path = "adapters/openmhs-mqtt" }
openmhs-sim = { path = "crates/openmhs-sim" }
openmhs-types = { path = "crates/openmhs-types" }

async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "7"
getrandom = "0.4"
jsonschema = { version = "0.60", default-features = false }
proptest = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
uuid = { version = "1", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
